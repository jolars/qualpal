name: Docs

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get install -y build-essential doxygen graphviz

      - uses: actions/setup-python@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --prefix web

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2.1
        with:
          cmake-version: "3.25"

      - name: Configure CMake
        run: cmake -B build -S . -DBUILD_DOCS=ON -DBUILD_TESTING=OFF -DBUILD_CLI=OFF

      - name: Build
        run: cmake --build build --target docs

      - name: Check documentation compatibility
        run: python3 docs/check_site.py build/docs/html

      - name: Check Workers packaging
        run: npm exec --prefix web -- wrangler deploy --config docs/wrangler.jsonc --dry-run

      - name: Build legacy redirects
        run: python3 docs/redirect_pages.py build/docs/html build/docs/redirects

      - uses: actions/upload-artifact@v7
        with:
          name: docs
          path: build/docs/html
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs/redirects

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: docs-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --prefix web

      - uses: actions/download-artifact@v8
        with:
          name: docs
          path: build/docs/html

      - name: Deploy documentation to Workers
        run: npm exec --prefix web -- wrangler deploy --config docs/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify the deployed documentation
        run: |
          curl --fail --silent --show-error https://qualpal.cc/docs/ -o /tmp/docs-index.html
          curl --fail --silent --show-error https://qualpal.cc/docs/classqualpal_1_1Qualpal.html -o /tmp/docs-api.html
          grep -q 'Generated by Doxygen' /tmp/docs-index.html
          grep -q 'Generated by Doxygen' /tmp/docs-api.html
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://qualpal.cc/docs/missing-page.html)
          test "$status" = 404

  redirects:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: docs-legacy-redirects
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup pages
        uses: actions/configure-pages@v6

      - name: Publish legacy redirects to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
