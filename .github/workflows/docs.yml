name: Site
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_legacy_pages:
        description: Publish GitHub Pages compatibility redirects after the production smoke test
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: pins
        run: |
          source site/sources.env
          echo "diplodocus=$DIPLODOCUS_REV" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: jolars/diplodocus
          ref: ${{ steps.pins.outputs.diplodocus }}
          path: build/diplodocus
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R extraction dependencies
        shell: Rscript --vanilla {0}
        run: |
          packages <- c("pkgload", "pkgbuild", "cpp11", "roxygen2", "evaluate", "jsonlite")
          install.packages(packages, repos = Sys.getenv("RSPM", "https://cloud.r-project.org"))
          stopifnot(all(vapply(packages, requireNamespace, logical(1), quietly = TRUE)))
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y doxygen
      - run: cargo build --release --locked --bin diplodocus
        working-directory: build/diplodocus
      - run: npm ci --prefix web
      - run: npm run test:worker --prefix web
      - run: bash site/build.sh
        env:
          DIPLODOCUS: build/diplodocus/target/release/diplodocus
      - run: npm exec --prefix web -- wrangler deploy --config web/wrangler.jsonc --dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: build/site
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: site-production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --prefix web
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: build/site
      - run: npm exec --prefix web -- wrangler deploy --config web/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test production
        run: |
          for path in / /app/ /docs/ /packages/cpp/ /packages/r/ /packages/python/ /docs/classqualpal_1_1Qualpal.html; do
            curl --fail --silent --show-error --location "https://qualpal.cc$path" -o /dev/null
          done


  legacy-pages:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_legacy_pages
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: 7a74dba42f61cba926d2cd1dfbab6cefea9cfaf9
          path: build/legacy-source
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - run: |
          cmake -B build/legacy-doxygen -S build/legacy-source -DBUILD_DOCS=ON -DBUILD_TESTING=OFF
          cmake --build build/legacy-doxygen --target docs
          python3 docs/redirect_pages.py build/legacy-doxygen/docs/html build/legacy-pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/legacy-pages
      - uses: actions/deploy-pages@v5
        id: pages
