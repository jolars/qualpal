name: Build-and-test

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: Ubuntu x64
          - os: macos-latest
            name: macOS Apple Silicon
          - os: macos-15-intel
            name: macOS Intel
          - os: windows-latest
            compiler: mingw
            name: Windows x64 MinGW
          - os: windows-latest
            compiler: msvc
            name: Windows x64 MSVC
          - os: windows-11-arm
            compiler: msvc
            name: Windows ARM MSVC
      fail-fast: false
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y \
            build-essential \
            catch2

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install eigen catch2

      - name: Install dependencies (Windows MinGW x64)
        if: runner.os == 'Windows' && matrix.compiler == 'mingw'
        run: |
          choco install mingw
          vcpkg install catch2 --triplet x64-mingw-dynamic

      - name: Install dependencies (Windows MSVC x64)
        if: runner.os == 'Windows' && matrix.compiler == 'msvc' && matrix.os == 'windows-latest'
        run: vcpkg install catch2 --triplet x64-windows

      - name: Install dependencies (Windows MSVC ARM)
        if: runner.os == 'Windows' && matrix.compiler == 'msvc' && matrix.os == 'windows-11-arm'
        run: vcpkg install catch2 --triplet arm64-windows

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Configure CMake
        run: cmake -B build -S . -DBUILD_CLI=ON -DBUILD_TESTING=ON ${{ matrix.compiler == 'mingw' && '-G "MinGW Makefiles" -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-mingw-dynamic' || matrix.compiler == 'msvc' && matrix.os == 'windows-latest' && '-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows' || matrix.compiler == 'msvc' && matrix.os == 'windows-11-arm' && '-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=arm64-windows' || '' }}

      - name: Build
        run: cmake --build build ${{ matrix.compiler == 'msvc' && '--config Release' || '' }}

      - name: Install
        run: ${{ matrix.compiler == 'msvc' && 'cmake --install build --config Release' || runner.os == 'Windows' && 'cmake --install build' || 'sudo cmake --install build' }}

      - name: Test
        run: ctest --test-dir build --output-on-failure

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get install -y build-essential doxygen graphviz

      - uses: actions/setup-python@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --prefix web

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Configure CMake
        run: cmake -B build -S . -DBUILD_DOCS=ON -DBUILD_TESTING=OFF -DBUILD_CLI=ON

      - name: Build
        run: cmake --build build --target docs

      - name: Check documentation compatibility
        run: python3 docs/check_site.py build/docs/html

      - name: Check Workers packaging
        run: npm exec --prefix web -- wrangler deploy --config docs/wrangler.jsonc --dry-run

      - name: Build legacy redirects
        run: python3 docs/redirect_pages.py build/docs/html build/docs/redirects
